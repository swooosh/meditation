      base_hz: 174
      delta_hz: 10
      level: 0.025
  
  - type: spatial_sweep
    params:
      sweep_period_s: 8.0
      pan_depth: 0.6
      level: 0.030
  
  - type: pulse_cues
    params:
      interval_s: 12
      width_ms: 80
      level: 0.045

identity:
  signature_hz: [174, 220, 293]
  signature_ms: 300
  signature_level: 0.020
